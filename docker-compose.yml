# ModWatch production stack: app + PostgreSQL.
# Start: cp .env.example .env  (edit secrets)  docker compose up -d --build
# Demo data is never loaded automatically. Run it once with:
#   docker compose exec app npm run seed:demo

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-modwatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-modwatch}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: ./server
    image: modwatch:${APP_VERSION:-1.0}
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-modwatch}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-modwatch}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      APP_URL: ${APP_URL:-}
      APP_VERSION: ${APP_VERSION:-1.0}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      CHECK_INTERVAL_HOURS: ${CHECK_INTERVAL_HOURS:-6}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      CURSEFORGE_API_KEY: ${CURSEFORGE_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    ports:
      - "${MODWATCH_PORT:-3411}:3000"
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

volumes:
  db-data:
  uploads:
