    <rect x="284" y="500" width="128" height="42" rx="21" fill="#1b1b20"/><text x="348" y="528" text-anchor="middle">NeoForge</text>
    <rect x="424" y="500" width="92" height="42" rx="21" fill="#1b1b20"/><text x="470" y="528" text-anchor="middle">Quilt</text>
  </g>

