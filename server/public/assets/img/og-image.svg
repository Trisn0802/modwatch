  <text x="72" y="410" font-size="26" font-weight="400" fill="#b0bac5">Self-hosted update tracker for Forge, Fabric,</text>
  <text x="72" y="446" font-size="26" font-weight="400" fill="#b0bac5">NeoForge and Quilt modpacks.</text>

